# SPA-serving nginx config for the LAPS frontend.
#
# What this file does in plain terms:
#   1. Serve the static SPA bundle under /
#   2. Fall back any unknown route to index.html so TanStack Router can take
#      over client-side
#   3. Reverse-proxy /api/v1/* + /uploads/* to the backend service so the SPA
#      can call same-origin (avoids CORS in production, keeps cookies honest)
#   4. Apply baseline security headers
#
# Hardening notes:
#   - server_tokens off  → no nginx version in error pages
#   - No directory listing, no autoindex
#   - CSP allows same-origin scripts only; loosen if you later add Google
#     Fonts / analytics / etc.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Hide nginx version from error pages and Server header.
    server_tokens off;

    # Maximum body size matches the backend's 6 MiB multipart cap.
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # Cheap local healthcheck for the Docker HEALTHCHECK command. Skips the
    # access log so the line noise doesn't drown out real traffic.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ───── API + uploads → backend ─────
    # Same-origin proxy so the browser thinks the SPA and API live together;
    # the JWT cookie flows naturally without SameSite=None or wildcard CORS.
    # `LAPS_API_UPSTREAM` is templated in at container start by the docker
    # entrypoint, default is the compose service name.
    location /api/ {
        proxy_pass http://laps-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://laps-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 24h;
    }

    # ───── Static assets ─────
    # Hashed asset filenames get the long cache; index.html stays no-cache so
    # users always get the latest router shell.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ───── SPA fallback ─────
    # Any non-asset path that's not the API gets the SPA shell so the client
    # router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;

        # Baseline security headers — applied at the document boundary.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # CSP — keep in sync with SecurityConfig, which serves the same SPA on the
        # Render monolith. script-src needs 'unsafe-inline' because TanStack Start
        # emits the hydration payload as inline <script>; without it the app never
        # mounts and the page is blank. See SecurityConfig for the trade-off note.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Block hidden files like .git, .env, .htaccess that should never be
    # served. Defense in depth — the Dockerfile already excludes these from
    # the image.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
